# Web 容器同时提供 Vue 静态资源和 API 反向代理。
server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 与 Egg 上传限制保持余量一致。
    client_max_body_size 220m;

    # 压缩文本资源，降低首屏 JavaScript 和 CSS 的网络传输量。
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/xml
        image/svg+xml;

    # Docker 和 CI/CD 使用的无依赖健康检查。
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # 浏览器使用同源 /api，避免暴露 API 容器端口和跨域配置。
    location /api/ {
        proxy_pass http://api:7001;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 上传和文件处理接口允许较长响应时间。
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Vite 产物带内容哈希，可以使用长期浏览器缓存。
    location ~* \.(?:css|js|jpg|jpeg|png|gif|svg|ico|webp|woff|woff2|ttf)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Vue Router history 模式统一回退到 index.html。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
