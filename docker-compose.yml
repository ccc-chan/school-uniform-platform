services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-school_uniform}
      MYSQL_USER: ${DB_USER:-school_uniform}
      MYSQL_PASSWORD: ${DB_PASSWORD:-school_uniform_dev}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-school_uniform_root_dev}
      TZ: Asia/Shanghai
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - school_uniform_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-school_uniform_root_dev}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Redis 保存登录会话、验证码、权限缓存和分布式限流计数。
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:-school_uniform_redis_dev}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - school_uniform_redis_data:/data
    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "-a",
          "${REDIS_PASSWORD:-school_uniform_redis_dev}",
          "ping"
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  # MinIO 为本地和测试环境提供兼容 S3 的对象存储。
  minio:
    image: minio/minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-school_uniform}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-school_uniform_minio_dev}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - school_uniform_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-school_uniform}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-school_uniform_minio_dev}
      MINIO_BUCKET: ${STORAGE_BUCKET:-school-uniform-dev}
    entrypoint:
      - /bin/sh
      - -c
      - >
        mc alias set local http://minio:9000
        "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        mc mb --ignore-existing "local/$$MINIO_BUCKET"

volumes:
  school_uniform_mysql_data:
  school_uniform_redis_data:
  school_uniform_minio_data:
