# 测试环境持续部署：
# main 每次 push 后先检查代码，再构建 linux/amd64 镜像并部署到京东云。
# SSH 密钥与 known_hosts 必须存放在 GitHub Environment「test」中。
name: Deploy test

on:
  push:
    branches:
      - main
  workflow_dispatch:

# 同一时间只允许一个测试部署运行，避免多个提交同时修改服务器。
concurrency:
  group: deploy-test
  cancel-in-progress: false

# 测试和类型检查通过后才允许发布镜像。
jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check API
        run: npm run check:api

      - name: Check Web types
        run: npm run typecheck

      - name: Check H5 types
        run: npm run typecheck:info

  build:
    name: Build ${{ matrix.component }}
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: api
            dockerfile: deploy/api.Dockerfile
            build_args: ""
          - component: web
            dockerfile: deploy/web.Dockerfile
            build_args: |
              VITE_QR_PUBLIC_BASE_URL=http://111.228.47.54:18080
              VITE_QR_ALLOW_HTTP_IN_TEST=true
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # 京东云服务器为 x86_64，因此镜像固定构建为 linux/amd64。
      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          build-args: ${{ matrix.build_args }}
          # test-latest 供日常自动部署；commit SHA 标签用于精确回滚。
          tags: |
            ghcr.io/${{ github.repository }}-${{ matrix.component }}:test-latest
            ghcr.io/${{ github.repository }}-${{ matrix.component }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  deploy:
    name: Deploy to JD Cloud
    needs: build
    runs-on: ubuntu-latest
    environment: test
    permissions:
      contents: read
    env:
      DEPLOY_HOST: ${{ vars.TEST_SSH_HOST }}
      DEPLOY_PORT: ${{ vars.TEST_SSH_PORT }}
      DEPLOY_USER: ${{ vars.TEST_SSH_USER }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TEST_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.TEST_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/test_deploy
          chmod 600 ~/.ssh/test_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload Compose configuration
        run: |
          scp \
            -P "$DEPLOY_PORT" \
            -i ~/.ssh/test_deploy \
            docker-compose.prod.yml \
            "$DEPLOY_USER@$DEPLOY_HOST:/opt/school-uniform-platform/docker-compose.prod.yml"

      - name: Pull and deploy
        run: |
          ssh \
            -p "$DEPLOY_PORT" \
            -i ~/.ssh/test_deploy \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            'set -e
             cd /opt/school-uniform-platform
             docker compose --env-file .env.test -f docker-compose.prod.yml pull api web
             # 迁移可以重复安全执行；seed 不自动执行，防止重复写入初始化数据。
             docker compose --env-file .env.test -f docker-compose.prod.yml run --rm api npm run db:migrate:test
             docker compose --env-file .env.test -f docker-compose.prod.yml up -d --no-build --wait --wait-timeout 180
             curl --fail --silent --show-error http://127.0.0.1:18080/healthz
             curl --fail --silent --show-error http://127.0.0.1:18080/api/v1/health
             curl --fail --silent --show-error http://127.0.0.1:18080/school_uniform_info/
             docker image prune -f'
